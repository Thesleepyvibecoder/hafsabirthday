<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter | Hafsa The Great</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cursor-glow"></div>
  <div class="floating-bg"></div>

  <nav class="navbar glass">
    <a href="index.html" class="logo">Hafsa The Great</a>
    <div class="nav-links">
      <a href="cake.html">Cake</a>
      <a href="memories.html">Story</a>
      <a href="reasons.html">Reasons</a>
      <a href="letter.html">Letter</a>
      <a href="quiz.html">Quiz</a>
      <a href="final.html">Final</a>
    </div>
  </nav>

  <main class="letter-page">
    <section class="envelope reveal" id="envelope">
      <div class="flap"></div>
      <div class="env-body"><p>Click to open</p></div>
    </section>

    <section class="letter-paper reveal delay-1" id="letterPaper">
      <p class="script-text">Dear Hafsa The Great,</p>
      <p id="typedLetter"></p>
      <div class="voice-note" id="voiceNote" aria-label="Voice note player">
        <button class="voice-play-btn" id="voicePlayBtn" type="button" aria-label="Play voice note" title="Play voice note">▶</button>
        <div class="voice-wave-wrap">
          <div class="voice-wave" id="voiceWave" aria-hidden="true"></div>
          <div class="voice-time"><span id="voiceCurrent">0:00</span><span id="voiceDuration">0:00</span></div>
        </div>
        <audio id="voiceNoteAudio" src="assets/hafsa-letter-voice-note.mp3" preload="metadata"></audio>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
