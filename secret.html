<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<body class="secret-page sketch-page">
  <div class="cursor-glow"></div>
  <div class="floating-bg"></div>

  <main class="sketch-shell">
    <section class="sketch-intro reveal">
      <p class="script-text">one last thing</p>
      <h1>A little something<br><span>I drew for you.</span></h1>
      <p class="sketch-note">It’s been ages since I’ve drawn with an actual pencil, especially someone’s face. So sorry if it’s not as good as your great, magnificent, brilliant and exquisite face, because I just had one Nataraj pencil, and that is it. 😭</p>
    </section>

    <section class="sketch-card glass reveal delay-1" aria-label="Hand-drawn sketches">
      <div class="sketch-gallery">
        <figure class="sketch-frame">
          <img src="assets/hafsa-sketch-1.jpg" alt="Hand-drawn pencil sketch of Hafsa" />
        </figure>
        <figure class="sketch-frame">
          <img src="assets/hafsa-sketch-2.jpg" alt="Hand-drawn pencil sketch of Hafsa" />
        </figure>
      </div>
    </section>

    <a class="btn secondary sketch-back" href="quiz.html">Back to the Quiz</a>

  <script src="script.js"></script>
